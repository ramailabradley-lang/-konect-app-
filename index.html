<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>KONECT — Connecting Beyond Limits</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; background: #04110F; color: #EAF7F4;
      font-family: system-ui, Arial, sans-serif; height: 100%;
      overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0;
    }
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      background: #061A17; padding: 10px 12px; display: flex;
      align-items: center; gap: 10px; border-bottom: 1px solid #00FFD033;
    }
    header .logo {
      width: 48px; height: 48px; background: #00FFD0; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: #03201C; font-size: 28px;
      box-shadow: 0 0 20px #00FFD088; flex-shrink: 0;
    }
    header small { color: #8AA5A0; letter-spacing: 1px; }
    main {
      position: absolute; top: 68px; bottom: 64px; left: 0; right: 0;
      overflow-y: auto; overflow-x: hidden;
    }
    section { padding: 2px 0; }
    .card {
      background: #0D1F1D; border: 1px solid #00FFD033;
      border-radius: 18px; padding: 14px; margin: 12px;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    input, textarea, select {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 1px solid #00FFD033; background: #07100F;
      color: #fff; margin: 6px 0; font-size: 16px;
    }
    button {
      background: #00FFD0; border: none; padding: 12px; border-radius: 12px;
      font-weight: 800; color: #03201C; width: 100%; cursor: pointer; margin: 4px 0;
    }
    button:active { opacity: .85; }
    button:disabled { opacity: .6; }
    .btn2 { background: #0D2A26; color: #fff; border: 1px solid #00FFD033; }
    .post {
      background: #0A1F1C; border: 1px solid #00FFD022;
      border-radius: 18px; padding: 14px; margin: 12px;
    }
    .post img, .post video { width: 100%; border-radius: 14px; margin-top: 8px; }
    .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .actions button { font-size: 13px; padding: 10px; flex: 1; margin: 0; }
    .bottom {
      position: fixed; bottom: 0; left: 0; right: 0; background: #0A1F1C;
      display: flex; padding: 6px; border-top: 1px solid #00FFD033; z-index: 20;
    }
    .bottom button {
      flex: 1; background: transparent; color: #8AA5A0; font-size: 11px;
      padding: 8px 2px; border-radius: 12px; margin: 0 2px;
    }
    .bottom button.on { color: #00FFD0; background: #00FFD022; }
    .hidden { display: none; }
    video { width: 100%; background: #000; border-radius: 12px; max-height: 280px; }
    small { color: #8AA5A0; }
    .gift {
      display: inline-block; background: #FF2D5522; border: 1px solid #FF2D55;
      padding: 6px 10px; border-radius: 20px; margin: 3px; font-size: 12px;
    }
    .badge {
      background: #00FFD022; border: 1px solid #00FFD033;
      padding: 4px 8px; border-radius: 20px; font-size: 11px;
    }
    .stories {
      display: flex; gap: 12px; overflow-x: auto;
      padding: 12px 12px 4px; scrollbar-width: none;
    }
    .stories::-webkit-scrollbar { display: none; }
    .story { flex: 0 0 72px; text-align: center; cursor: pointer; }
    .story .ring {
      width: 68px; height: 68px; border-radius: 50%; border: 3px solid #00FFD0;
      display: flex; align-items: center; justify-content: center;
      background: #1A2E2B; font-weight: 800; font-size: 13px;
      box-shadow: 0 0 14px #00FFD055; margin: 0 auto;
    }
    .story small { display: block; margin-top: 6px; color: #EAF7F4; font-size: 11px; }
    .hub {
      background: #00FFD0; color: #03201C; border-radius: 20px;
      padding: 10px 16px; font-weight: 900; display: inline-block; font-size: 13px;
    }
    .composer {
      background: #0D1F1D; border: 1px solid #00FFD033;
      border-radius: 18px; padding: 14px; margin: 12px;
    }
    .topbtn {
      width: 42px; height: 42px; border-radius: 50%; background: #0D2A26;
      color: #fff; font-size: 16px; padding: 0; flex-shrink: 0; margin: 0;
    }
    .enttab {
      background: #071F1C; border: 1px solid #00FFD033; color: #fff;
      padding: 8px 14px; border-radius: 20px; font-size: 12px;
      white-space: nowrap; width: auto;
    }
    .enttab.on { background: #00FFD0; color: #03201C; font-weight: 800; }
    .pill2 {
      background: #00FFD022; border: 1px solid #00FFD033;
      padding: 6px 10px; border-radius: 20px; font-size: 11px;
    }
    /* Media Filters */
    .f-Glow { filter: brightness(1.15) saturate(1.3); }
    .f-Aqua { filter: hue-rotate(15deg) saturate(1.4) contrast(1.05); }
    .f-Cinema { filter: contrast(1.25) saturate(0.85) sepia(0.15); }
    .f-Night { filter: brightness(0.85) contrast(1.3) hue-rotate(-15deg); }
  </style>
</head>
<body>

<header>
  <button class="topbtn" onclick="go('profile')">☰</button>
  <div class="logo">K</div>
  <div style="overflow:hidden">
    <b style="font-size:20px">KONECT</b><span style="color:#00FFD0"> •</span><br>
    <small style="font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">CONNECTING BEYOND LIMITS • CONTENT HUB</small>
  </div>
  <button class="btn2 topbtn" style="margin-left:auto" onclick="go('notif')">🔔<br><span id="notifCount" style="font-size:10px">0</span></button>
  <button class="btn2 topbtn" onclick="go('msg')">✉️</button>
  <button class="btn2 topbtn" onclick="go('calls')">((•))</button>
</header>

<main id="app">
  <!-- HOME VIEW -->
  <section id="v-home">
    <div class="stories" id="stories"></div>
    <div class="row" style="padding:0 12px;gap:6px;flex-wrap:wrap">
      <button class="btn2" style="width:auto;padding:8px 12px" onclick="addStory()">+ Story 24h</button>
      <button class="btn2" style="width:auto;padding:8px 12px" onclick="go('profile')">⭐ Highlights</button>
      <button class="btn2" style="width:auto;padding:8px 12px" id="lowDataBtn" onclick="toggleLowData()">📶 Low-Data: OFF</button>
      <select id="langSel" onchange="setLang(this.value)" style="width:110px;margin:0;padding:8px">
        <option value="en">English</option>
        <option value="nso">Sepedi</option>
        <option value="zu">Zulu</option>
        <option value="af">Afrikaans</option>
        <option value="xh">Xhosa</option>
      </select>
    </div>

    <div class="composer">
      <div style="text-align:center;margin-bottom:8px">
        <b>KONECT — Content Creation Hub</b><br>
        <small id="hubSub">Create • Post • Go Live • Entertain</small><br>
        <small>Connection: <span id="connQuality">Checking...</span> • <span id="connStatus2">Connecting...</span></small>
      </div>
      <div class="row">
        <div style="width:44px;height:44px;border-radius:50%;background:#00FFD0;color:#03201C;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0" id="youAvatar">YOU</div>
        <textarea id="txt" placeholder="What's connecting you today?" style="margin:0" rows="2"></textarea>
      </div>
      <div class="row" style="margin-top:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn2" style="width:auto;padding:8px 14px" onclick="openCamera('image/*')">🖼️ Photo</button>
        <button class="btn2" style="width:auto;padding:8px 14px" onclick="openCamera('video/*')">🎥 Video</button>
        <button style="width:auto;padding:8px 18px" onclick="post()">Post</button>
        <button class="btn2" style="width:auto;padding:8px 14px" onclick="go('create')">Create Hub</button>
        <button class="btn2" style="width:auto;padding:8px 14px" onclick="createSeries()">📺 Series</button>
      </div>
      <input type="file" id="mediaFile" accept="image/*,video/*" onchange="previewMedia(event)" style="display:none">
      <div id="mediaPreview" style="margin-top:8px"></div>
      <div class="row" style="margin-top:8px">
        <select id="filterSel" style="margin:0">
          <option>No Filter</option>
          <option>Glow</option>
          <option>Aqua</option>
          <option>Cinema</option>
          <option>Night</option>
        </select>
        <button class="btn2" style="width:110px;margin:0" onclick="go('search')">Search</button>
      </div>
    </div>

    <div class="card">
      <button class="hub" style="width:100%;text-align:center" onclick="toggleHub('hubHome')">⚡ ENTERTAINMENT HUB — Tap to Open ▼</button>
      <div id="hubHome" class="hidden">
        <p><small>• Curated for you • Live now</small></p>
        <div class="row" style="flex-wrap:wrap;margin:8px 0">
          <button class="enttab on" onclick="setEnt('All',this)">All</button>
          <button class="enttab" onclick="setEnt('Sports',this)">Sports</button>
          <button class="enttab" onclick="setEnt('News',this)">News</button>
          <button class="enttab" onclick="setEnt('Trend',this)">Trend</button>
          <button class="enttab" onclick="setEnt('Music',this)">Music</button>
          <button class="enttab" onclick="setEnt('Movies',this)">Movies</button>
          <button class="enttab" onclick="setEnt('Gaming',this)">Gaming</button>
        </div>
        <div id="entPreview"></div>
        <button class="btn2" onclick="go('ent')">Open Full Entertainment</button>
      </div>
    </div>

    <div id="feed"></div>
  </section>

  <!-- SEARCH VIEW -->
  <section id="v-search" class="hidden">
    <div class="card">
      <h3>Search — Real Only</h3>
      <input id="search2" placeholder="Search posts, creators, tags...">
      <button onclick="doSearch2()">Search</button>
      <div id="searchRes" style="margin-top:10px"></div>
    </div>
